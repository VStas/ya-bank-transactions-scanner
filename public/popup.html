<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YaBank Scanner</title>
    <style>
      body {
        margin: 0;
        padding: 12px 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        background: #0b1120;
        color: #e5e7eb;
        min-width: 220px;
      }

      .card {
        border-radius: 10px;
        padding: 12px 14px;
        background: radial-gradient(circle at top left, #111827 0, #020617 55%, #000 100%);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }

      .title {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9ca3af;
        margin-bottom: 4px;
      }

      .headline {
        font-size: 16px;
        font-weight: 600;
        color: #e5e7eb;
        margin-bottom: 2px;
      }

      .subtitle {
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">YaBank Scanner</div>
      <div class="headline">Hello 👋</div>
      <div class="subtitle">Popup UI is mocked for now.</div>
      <button id="downloadCSV">Download CSV</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
